name: Update Civ VII registry

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape official pages and rebuild registry
        run: python utils/update_registry.py --report drift-report.md

      - name: Commit registry changes
        run: |
          if ! git diff --quiet data/registry.json 2>/dev/null || [ -n "$(git status --porcelain data/registry.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/registry.json
            git commit -m "Update Civ VII registry from official 2K pages"
            git push
          else
            echo "Registry unchanged; nothing to commit."
          fi

      - name: Open or update drift issue
        if: ${{ hashFiles('drift-report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Civ VII registry drift: app data is out of date"
          BODY_FILE=drift-report.md
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label "registry-drift" || \
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi

      - name: Close drift issue when resolved
        if: ${{ hashFiles('drift-report.md') == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Civ VII registry drift: app data is out of date"
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Drift resolved: app data now matches the official pages."
          fi
