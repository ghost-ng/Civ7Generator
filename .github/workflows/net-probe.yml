# Temporary diagnostic: which data sources are reachable from GitHub runners?
# Delete after the registry-fetch 403 investigation is done.
name: Net probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          probe() {
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 45 -H "User-Agent: $UA" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" -L "$1" || echo "ERR")
            echo "$code $(wc -c < /tmp/body) $1"
          }
          probe "https://civilization.2k.com/civ-vii/game-guide/leaders/"
          probe "https://civilization.2k.com/"
          probe "https://civilization.fandom.com/api.php?action=query&meta=siteinfo&format=json"
          probe "https://civilization.fandom.com/wiki/Civilization_VII"
          probe "https://web.archive.org/web/2id_/https://civilization.2k.com/civ-vii/game-guide/leaders/"
          probe "https://archive.org/wayback/available?url=civilization.2k.com/civ-vii/game-guide/leaders/"
          echo "--- first 300 bytes of last body ---"
          head -c 300 /tmp/body || true
